name: Build, push and deploy flask app

on:
  push:
    branch: ["main"]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest .

      - name: Push docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest 

  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to vm over ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: $(( secrets.VM_HOST ))
          username: $(( secrets.VM_USERNAME ))
          key: $(( secrets.VM_SSH_KEY ))
          script: |
            docker pull haddeybabs/flask-app:latest
            docker rm -f flask-app || true
            docker run -d --name flask-app -p 5000:5000 haddeybabs/flask-app:latest
          
